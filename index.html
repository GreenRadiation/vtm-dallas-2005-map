<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Даллас 2005 · карта районов</title>
<meta name="description" content="Карта районов Далласа, Форт-Уэрта и пригородов 2005 года для настольной ролевой игры Vampire: The Masquerade (V20). Описания на русском.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="root">
  <header class="top">
    <div class="brand"><div class="eyebrow">Vampire: The Masquerade · 2005</div><h1>Даллас 2005</h1></div>
    <div class="search"><input id="q" type="search" placeholder="Найти район, место, тег, метку" autocomplete="off" aria-label="Поиск по карте"><div class="results" id="results" hidden></div></div>
    <div class="ctl">
      <button class="btn" type="button" id="collapse" disabled title="Вернуться к городам и пригородам">Свернуть всё</button>
      <div class="slots-pick" id="slots"><button class="btn" type="button" id="slots-btn" aria-haspopup="true" aria-expanded="false">Метки</button><div class="slots-pop" id="slots-pop" hidden></div></div>
      <div class="ref" id="ref" hidden></div>
      <label class="tog lens-pick">Линза <select id="lens" aria-label="Линза карты"><option value="">нет</option><option value="wealth">достаток</option><option value="people">жители</option><option value="street">улица</option><option value="eyes">глаза</option><option value="night">ночная жизнь</option><option value="build">застройка</option><option value="police">полиция</option></select></label>
      <label class="tog" title="Линии поездов и станции 2005 года"><input type="checkbox" id="dart-tog"> DART</label>
      <label class="tog" title="Показать сразу самые мелкие районы, без раскрытия"><input type="checkbox" id="leaf-tog"> Все районы</label>
      <label class="tog"><input type="checkbox" id="grid-tog"> Старая сетка</label>
    </div>
  </header>
  <main class="main">
    <div class="mapbox"><div id="map" aria-label="Карта районов"></div><div class="map-side"></div><p class="place-hint" id="place-hint" hidden>Нажми на карту, где поставить метку · Esc — отмена</p><p class="loading" id="loading">Загружаю карту…</p></div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
